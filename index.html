<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StreamForge - Automated live streaming</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e1a;--pn:#111729;--pn2:#171f38;--ln:#222c48;--tx:#e9edf7;--mu:#8c99b8;--ac:#4f7bff;--acx:#fff;--live:#ff4d5e;--ok:#2dd4a7;--f:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f5f7fb;--pn:#fff;--pn2:#eef2fa;--ln:#dde3f0;--tx:#0f172a;--mu:#5b6785;--ac:#2f5fe8;--ok:#0b8f6c}}
:root[data-theme="light"]{--bg:#f5f7fb;--pn:#fff;--pn2:#eef2fa;--ln:#dde3f0;--tx:#0f172a;--mu:#5b6785;--ac:#2f5fe8;--ok:#0b8f6c}
:root[data-theme="dark"]{--bg:#0a0e1a;--pn:#111729;--pn2:#171f38;--ln:#222c48;--tx:#e9edf7;--mu:#8c99b8;--ac:#4f7bff;--ok:#2dd4a7}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 var(--f);-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0 0 .5em;line-height:1.15;letter-spacing:-.02em}
h1{font-size:clamp(2.1rem,7.5vw,3.5rem);font-weight:800}h2{font-size:1.5rem;font-weight:800}h3{font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
p{margin:0 0 1em;color:var(--mu)}a{color:var(--ac)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.pub{display:flex;align-items:center;gap:6px 22px;flex-wrap:wrap;max-width:1080px;margin:0 auto;padding:16px 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem;color:var(--tx);text-decoration:none;margin-right:auto}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--ac),#8b5cf6);display:grid;place-items:center;color:#fff}
.logo svg{width:16px;height:16px}
.pub a.l{color:var(--mu);text-decoration:none;font-weight:600;padding:10px 0}
.pub a.l:hover{color:var(--tx)}
button,.btn{font:700 .95rem var(--f);background:var(--ac);color:var(--acx);border:1px solid transparent;border-radius:10px;padding:11px 18px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.g,button.g{background:transparent;color:var(--tx);border-color:var(--ln)}
.btn.g:hover,button.g:hover{background:var(--pn2)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hero{display:grid;gap:36px;padding:28px 0 40px;align-items:center}
@media(min-width:900px){.hero{grid-template-columns:1.05fr .95fr;padding:56px 0}}
.hero p.lead{font-size:1.12rem;max-width:32em}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.con{background:var(--pn);border:1px solid var(--ln);border-radius:16px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.con .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ln);font-size:.85rem;color:var(--mu)}
.scr{aspect-ratio:16/9;background:radial-gradient(circle at 30% 30%,#2b3d7a,#10172e 70%);position:relative;margin:14px;border-radius:10px;display:grid;place-items:center;color:#cfd8f5;font-weight:600}
.badge{position:absolute;top:10px;left:10px;display:inline-flex;gap:6px;align-items:center;background:var(--live);color:#fff;font-weight:800;font-size:.75rem;padding:3px 9px;border-radius:99px}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:p 1.6s infinite}
@keyframes p{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.badge::before{animation:none}}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--ln);border-top:1px solid var(--ln)}
.kv div{background:var(--pn);padding:10px 14px;font-size:.88rem}
.kv small{display:block;color:var(--mu)}
.sec{padding:30px 0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:20px}
.card p:last-child{margin-bottom:0}
.ico{width:40px;height:40px;border-radius:10px;background:var(--pn2);display:grid;place-items:center;color:var(--ac);margin-bottom:12px}
.tag{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--pn2);color:var(--mu)}
.tag.ok{color:var(--ok)}
.price{font-size:2rem;font-weight:800;letter-spacing:-.02em}
ul.k{list-style:none;padding:0;margin:14px 0 0}
ul.k li{padding:8px 0;border-top:1px solid var(--ln);color:var(--mu);font-size:.95rem}
.auth{min-height:80vh;display:grid;place-items:center;padding:20px}
.auth .card{width:100%;max-width:420px;padding:26px}
label{display:block;font-weight:600;font-size:.9rem;margin:16px 0 6px}
input,select,textarea{width:100%;font:1rem var(--f);color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:12px;min-height:46px}
.note{border:1px solid var(--ac);background:var(--pn2);border-radius:10px;padding:12px 14px;margin-top:16px;font-size:.92rem}
.note.w{border-color:var(--ln);color:var(--mu)}
/* app shell */
.app{display:flex;min-height:100vh}
.side{display:none;width:240px;flex:none;background:var(--pn);border-right:1px solid var(--ln);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .brand{padding:4px 8px 18px}
.nv{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--mu);text-decoration:none;font-weight:600;font-size:.95rem}
.nv:hover{background:var(--pn2);color:var(--tx)}
.nv.on{background:var(--pn2);color:var(--tx);box-shadow:inset 3px 0 0 var(--ac)}
.main{flex:1;min-width:0;padding-bottom:84px}
.top{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--ln);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.top h2{margin:0;font-size:1.15rem;margin-right:auto}
.cont{padding:22px 20px;max-width:900px}
.bot{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--pn);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
.bot a,.bot button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 .72rem var(--f);color:var(--mu);text-decoration:none;background:none;border:0;padding:6px 2px;min-height:48px;border-radius:8px}
.bot .on{color:var(--ac)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9;display:none}
.sheet.open{display:block}
.sheet div{position:absolute;left:0;right:0;bottom:0;background:var(--pn);border-radius:18px 18px 0 0;padding:14px 12px calc(14px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow-y:auto}
@media(min-width:900px){.side{display:block}.bot{display:none}.main{padding-bottom:0}.menu{display:none}}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--ln);counter-increment:s}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--pn2);display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none}
.steps a{margin-left:auto;font-weight:700;text-decoration:none}
.stat{font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.empty{text-align:center;padding:34px 16px}
.empty .ico{margin:0 auto 14px}
.two{display:grid;gap:0 16px}@media(min-width:640px){.two{grid-template-columns:1fr 1fr}}
footer{padding:36px 20px;text-align:center;color:var(--mu);font-size:.88rem;border-top:1px solid var(--ln);margin-top:30px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const CONFIG={supaUrl:"https://ybhgmlkivpqvogqeabcn.supabase.co",supaKey:"sb_publishable_EB2QWYEmOQR9-6roFiNuXQ__R_k2kZ4",name:"StreamForge",tagline:"Upload a video, pick your YouTube or Facebook channel, and keep it live from a server, not your phone."};
const P={home:"M3 11l9-8 9 8v10H3z",video:"M3 6h13v12H3zM16 10l5-3v10l-5-3",link:"M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1",radio:"M12 11a1 1 0 1 0 0 2 1 1 0 0 0 0-2zM7.5 7.5a6 6 0 0 0 0 9M16.5 7.5a6 6 0 0 1 0 9M4.5 4.5a10 10 0 0 0 0 15M19.5 4.5a10 10 0 0 1 0 15",clock:"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2",list:"M4 6h16M4 12h16M4 18h10",up:"M12 16V4M7 9l5-5 5 5M4 20h16",chart:"M4 20V10M10 20V4M16 20v-8M22 20H2",gear:"M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12l2-1-2-4-2 1-2-2 1-2-4-2-1 2h-3L7 2 3 4l1 2-2 2-2 0 0 4 2 0 2 2-1 2 4 2 1-2h3l1 2 4-2-1-2z",help:"M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17h0",shield:"M12 3l8 3v6c0 5-3.500 8-8 9-4.500-1-8-4-8-9V6z",bolt:"M13 2L4 14h7l-1 8 9-12h-7z",lock:"M6 11h12v9H6zM8 11V8a4 4 0 0 1 8 0v3",menu:"M4 7h16M4 12h16M4 17h16"};
const ic=n=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const S=[
 ["overview","Overview","home","",""],
 ["import","Import video","up","Add a video by upload or a direct file link you have the right to use.","Milestone 3"],
 ["library","Video library","video","Your videos with duration, resolution and size.","Milestone 3"],
 ["channels","Channels","link","Connect your YouTube channel or Facebook Page.","Milestones 5 and 6"],
 ["create","Go live","radio","","Milestone 4"],
 ["schedules","Schedules","clock","Streams that start at a time you pick.","Milestone 7"],
 ["playlists","24/7 playlists","list","Loop several videos nonstop on a server.","Milestone 7"],
 ["monitor","Active streams","bolt","Live status, uptime and errors reported by the server.","Milestone 7"],
 ["history","History","clock","Past streams and what happened in them.","Milestone 7"],
 ["usage","Plan and usage","chart","Storage, active streams and your plan limits.","Milestone 8"],
 ["settings","Settings","gear","Your name, password and theme.","Milestone 2"],
 ["help","Help","help","",""],
 ["admin","Admin","shield","Users, queue, failed jobs and system health. Admins only.","Milestone 8"]];
const PLANS=[["Free","500 MB",1,1,"720p"],["Basic","5 GB",2,3,"1080p"],["Premium","50 GB",5,5,"1080p"]];
const SU=CONFIG.supaUrl,SK=CONFIG.supaKey;
let sess=null,prof=null,cnt=null,busy=false;
try{sess=JSON.parse(localStorage.getItem("sf_s")||"null")}catch(e){}
function save(v){sess=v;try{v?localStorage.setItem("sf_s",JSON.stringify(v)):localStorage.removeItem("sf_s")}catch(e){}}
async function gt(path,body){const r=await fetch(SU+"/auth/v1/"+path,{method:"POST",headers:{apikey:SK,"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.msg||j.error_description||j.message||("Request failed ("+r.status+")"));return j}
function toSess(j){return{access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600),email:(j.user&&j.user.email)||""}}
async function ensure(){if(!sess)return false;if(sess.expires_at-60>Date.now()/1000)return true;try{const j=await gt("token?grant_type=refresh_token",{refresh_token:sess.refresh_token});save({...toSess(j),email:sess.email});return true}catch(e){save(null);return false}}
function rest(p,x){return fetch(SU+"/rest/v1/"+p,{headers:{apikey:SK,Authorization:"Bearer "+sess.access_token,...(x||{})}})}
async function count(p){try{const r=await rest(p,{Prefer:"count=exact",Range:"0-0"});const m=(r.headers.get("content-range")||"").split("/")[1];return r.ok&&m&&m!=="*"?Number(m):null}catch(e){return null}}
async function loadData(){try{if(!(await ensure())){prof=null;return}const r=await rest("profiles?select=display_name,plan_id");if(r.status===401){save(null);prof=null;return}const a=r.ok?await r.json():[];prof=a[0]||{};cnt={v:await count("video_assets?select=id"),a:await count("streaming_jobs?select=id&status=eq.live"),c:await count("destinations_public?select=id")}}catch(e){prof={};cnt={v:null,a:null,c:null}}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const logo=`<span class="logo">${ic("radio")}</span>`;

function pubShell(body){return `<div class="pub"><a class="brand" href="#/">${logo}${esc(CONFIG.name)}</a><a class="l" href="#/features">Features</a><a class="l" href="#/pricing">Pricing</a><a class="l" href="#/login">Log in</a><a class="btn" href="#/register">Sign up free</a></div><main class="wrap">${body}</main><footer>${esc(CONFIG.name)} is an early build. Pages marked with a milestone are not working yet.<br><button class="g" data-theme-toggle style="margin-top:12px">Switch theme</button></footer>`}
const feat=[["up","Import your videos","Upload a file or add a direct link. We read its length, size and resolution.","Milestone 3"],["link","Your own channels","Sign in with Google or Meta and choose the channel or Page to go live on.","Milestones 5 and 6"],["radio","Go live or schedule","Start now or pick a time. The stream runs on a server, not your phone.","Milestones 4 and 7"],["list","24/7 playlists","Loop a list of videos nonstop and recover on its own after a failure.","Milestone 7"],["video","Quality settings","360p to 1080p, bitrate and frame rate, within your plan.","Milestone 4"],["lock","Limits you can trust","Plan limits are enforced on the server. Billing stays off for now.","Milestone 8"]];
const featCards=feat.map(f=>`<div class="card"><div class="ico">${ic(f[0])}</div><h3>${f[1]}</h3><p>${f[2]}</p><span class="tag">${f[3]}</span></div>`).join("");

const pages={
home:()=>pubShell(`<section class="hero"><div><h1>Keep your live stream running while your phone rests.</h1><p class="lead">${esc(CONFIG.tagline)}</p><div class="row"><a class="btn" href="#/register">Create free account</a><a class="btn g" href="#/login">Log in</a></div></div>
<div class="con" aria-label="Sample preview, not real data"><div class="bar"><span>Live control</span><span class="tag">Sample preview</span></div><div class="scr"><span class="badge">LIVE</span>Your video here</div><div class="kv"><div><small>Destination</small>Your YouTube channel</div><div><small>Quality</small>720p, 2500 kbps</div><div><small>Mode</small>24/7 playlist</div><div><small>Status</small><span style="color:var(--ok)">Running on server</span></div></div></div></section>
<section class="sec"><div class="grid"><div class="card"><div class="ico">${ic("lock")}</div><h3>Only content you own</h3><p>Upload your own videos. Normal YouTube and Facebook watch links are not downloadable files.</p></div><div class="card"><div class="ico">${ic("bolt")}</div><h3>Runs without your phone</h3><p>Streams live on a server. Your phone only controls it.</p></div><div class="card"><div class="ico">${ic("chart")}</div><h3>Honest status</h3><p>The dashboard shows only what the server reports. No made-up numbers.</p></div></div></section>`),
features:()=>pubShell(`<section class="sec"><h1>Features</h1><p>Everything you need to run an automated stream.</p><div class="grid">${featCards}</div></section>`),
pricing:()=>pubShell(`<section class="sec"><h1>Pricing</h1><p>Paid billing is off until a payment provider is set up. These are the planned limits.</p><div class="grid">`+PLANS.map(p=>`<div class="card"><h3>${p[0]}</h3><div class="price">${p[2]} stream${p[2]>1?"s":""}</div><p>at the same time</p><ul class="k"><li>${p[1]} storage</li><li>${p[3]} connected destination${p[3]>1?"s":""}</li><li>Up to ${p[4]}</li></ul><p style="margin:14px 0 0"><span class="tag">Price not set</span></p></div>`).join("")+`</div></section>`),
login:()=>authPage("Welcome back","Log in"),
register:()=>authPage("Create your account","Create account")};
function authPage(t,b){const r=b==="Create account";return `<div class="auth"><div class="card"><a class="brand" href="#/" style="margin-bottom:18px">${logo}${esc(CONFIG.name)}</a><h2>${t}</h2><form id="af">${r?'<label for="n">Name</label><input id="n" autocomplete="name">':""}<label for="e">Email</label><input id="e" type="email" autocomplete="email"><label for="p">Password</label><input id="p" type="password" minlength="8" autocomplete="${r?"new-password":"current-password"}"><div class="row"><button type="submit" style="width:100%">${b}</button></div></form><div class="note" id="msg" hidden></div><p style="margin:16px 0 0">${r?'Have an account? <a href="#/login">Log in</a>':'New here? <a href="#/register">Create an account</a>'}</p></div></div>`}

function body(id){
 const s=S.find(x=>x[0]===id)||S[0];
 if(id==="settings")return `<div class="card"><h3>Your account</h3><ul class="k"><li>Email: ${esc((sess&&sess.email)||"")}</li><li>Name: ${esc((prof&&prof.display_name)||"Not set")}</li><li>Plan: ${esc((prof&&prof.plan_id)||"-")}</li></ul></div>`;
 if(id==="overview")return `<div class="note w" style="margin:0 0 18px">These numbers come from your own database. Streaming itself is not built yet (Milestone 4).</div><div class="grid" style="margin-bottom:18px">${[["Videos",cnt&&cnt.v],["Active streams",cnt&&cnt.a],["Channels",cnt&&cnt.c]].map(l=>`<div class="card"><p style="margin:0">${l[0]}</p><div class="stat">${l[1]==null?"-":l[1]}</div></div>`).join("")}</div><div class="card"><h3>Get started</h3><ol class="steps"><li>Create your account<span class="tag ok">Done</span></li><li>Connect a channel<a href="#/app/channels">Open</a></li><li>Add a video<a href="#/app/import">Open</a></li><li>Go live<a href="#/app/create">Open</a></li></ol></div>`;
 if(id==="create")return `<div class="card"><form id="cf"><div class="two"><div><label for="t">Stream title</label><input id="t" placeholder="My live stream"></div><div><label for="r">Resolution</label><select id="r"><option>360p</option><option>480p</option><option selected>720p</option><option>1080p</option></select></div></div><label for="d">Description</label><textarea id="d" rows="3"></textarea><div class="two"><div><label for="b">Bitrate (kbps)</label><input id="b" type="number" value="2500" min="500" max="6000"></div><div><label for="f">Frame rate</label><select id="f"><option>24</option><option selected>30</option><option>60</option></select></div></div><div class="row"><button type="submit">${ic("radio")} Go live</button></div></form><div class="note" id="msg" hidden></div></div>`;
 if(id==="help")return ["My video link does not work|Links to YouTube or Facebook watch pages cannot be streamed from. Upload a video you own, or use a direct file link (ending in .mp4) you have permission to use.","A page says it is not ready|Pages marked with a milestone are still being built and are not connected to any data.","Can the stream run from my phone?|No. A 24/7 stream needs an always-on server. Your phone only controls it."].map(x=>{const a=x.split("|");return `<div class="card" style="margin-bottom:12px"><h3>${a[0]}</h3><p>${a[1]}</p></div>`}).join("");
 return `<div class="card empty"><div class="ico">${ic(s[2])}</div><span class="tag">${s[4]}</span><h3 style="margin-top:12px">Not available yet</h3><p>${s[3]}</p><p>This page is built in ${s[4]} and is not connected to any data.</p></div>`;
}
function appShell(id){
 const s=S.find(x=>x[0]===id)||S[0];
 const link=x=>`<a class="nv ${x[0]===id?"on":""}" href="#/app/${x[0]}">${ic(x[2])}${x[1]}</a>`;
 const bn=["overview","library","create","monitor"].map(k=>S.find(x=>x[0]===k));
 return `<div class="app"><aside class="side"><a class="brand" href="#/">${logo}${esc(CONFIG.name)}</a>${S.map(link).join("")}</aside><div class="main"><header class="top"><h2>${s[1]}</h2><span class="tag">${prof&&prof.plan_id?esc(prof.plan_id):"your"} plan</span><button class="g" data-theme-toggle>Theme</button><button class="g" id="lo">Log out</button></header><div class="cont">${body(id)}</div></div></div>
 <nav class="bot">${bn.map(x=>`<a class="${x[0]===id?"on":""}" href="#/app/${x[0]}">${ic(x[2])}${x[1].split(" ")[0]}</a>`).join("")}<button id="mb">${ic("menu")}More</button></nav>
 <div class="sheet" id="sh"><div>${S.map(link).join("")}</div></div>`;
}
function render(){
 const h=location.hash.replace(/^#\/?/,"");
 if(h.startsWith("app")&&!sess){location.hash="#/login";return}
 if(h.startsWith("app")&&prof===null&&!busy){busy=true;loadData().then(()=>{busy=false;render()})}
 $("#root").innerHTML=h.startsWith("app")?appShell(h.split("/")[1]||"overview"):(pages[h]||pages.home)();
 window.scrollTo(0,0);
 document.querySelectorAll("[data-theme-toggle]").forEach(b=>b.onclick=()=>{const r=document.documentElement;const d=getComputedStyle(r).getPropertyValue("--bg").trim()==="#0a0e1a";r.dataset.theme=d?"light":"dark"});
 const af=$("#af"),cf=$("#cf"),mb=$("#mb"),sh=$("#sh");
